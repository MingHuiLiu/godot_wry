name: 🤖 GDExtension

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# CI builds distributable Godot addon artifacts for desktop, Android and iOS.
jobs:
  desktop:
    name: 🏗️ Desktop / ${{ matrix.platform.os-name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: 🐧 Linux (64-bit)
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os-name: 🍎 macOS (Universal)
            runs-on: macos-latest
            target: universal-apple-darwin
          - os-name: 🪟 Windows (64-bit)
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.runs-on }}
    env:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: ${{ matrix.platform.runs-on == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y             libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev             build-essential curl wget file libssl-dev             libayatana-appindicator3-dev librsvg2-dev             libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform.target }}

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Build binaries
        shell: bash
        run: just ${{ matrix.platform.target == 'universal-apple-darwin' && 'build-macos-universal' || 'build' }}

      - name: Code sign and notarize macOS library
        if: ${{ matrix.platform.target == 'universal-apple-darwin' && github.ref == 'refs/heads/main' && env.APPLE_CERT_BASE64 != '' }}
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_DEV_ID: ${{ secrets.APPLE_DEV_ID }}
          APPLE_DEV_TEAM_ID: ${{ secrets.APPLE_DEV_TEAM_ID }}
          APPLE_DEV_PASSWORD: ${{ secrets.APPLE_DEV_PASSWORD }}
          APPLE_DEV_APP_ID: ${{ secrets.APPLE_DEV_APP_ID }}
        run: |
          brew install powershell
          pwsh ./scripts/ci_sign_macos.ps1 godot/addons/godot_wry/bin/universal-apple-darwin/libgodot_wry.framework

      - name: Stage desktop artifact
        shell: bash
        run: |
          mkdir -p artifact/bin
          cp -R "godot/addons/godot_wry/bin/${{ matrix.platform.target }}" artifact/bin/

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform.target }}
          path: artifact
          if-no-files-found: error

  ios:
    name: 📱 iOS / device + simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Build iOS XCFramework
        run: just build-ios

      - name: Validate iOS package
        run: |
          XC=godot/addons/godot_wry/bin/ios/libgodot_wry.xcframework
          test -f "$XC/Info.plist"
          test -d "$XC"
          plutil -p "$XC/Info.plist"
          find "$XC" -type f -name libgodot_wry -print -exec file {} \;
          test "$(find "$XC" -type f -name libgodot_wry | wc -l | tr -d ' ')" -eq 2
          find "$XC" -type f -name libgodot_wry -exec codesign --verify --strict --verbose=2 {} \;

      - name: Stage iOS artifact
        run: |
          mkdir -p artifact/bin
          cp -R godot/addons/godot_wry/bin/ios artifact/bin/

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifact
          if-no-files-found: error

  android:
    name: 🤖 Android / arm64-v8a + x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Select Android NDK
        shell: bash
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          elif [ -n "${ANDROID_NDK_ROOT:-}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          else
            echo "No Android NDK found on runner" >&2
            exit 1
          fi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare WRY Kotlin output
        run: mkdir -p "$GITHUB_WORKSPACE/build/android-kotlin/com/example/godotwry"

      - name: Build Android native libraries
        working-directory: rust
        env:
          WRY_ANDROID_PACKAGE: com.example.godotwry
          WRY_ANDROID_LIBRARY: godot_wry
          WRY_ANDROID_KOTLIN_FILES_OUT_DIR: ${{ github.workspace }}/build/android-kotlin/com/example/godotwry
        run: |
          cargo ndk -t aarch64-linux-android -o ../godot/addons/godot_wry/bin/android build --locked --release
          cargo ndk -t x86_64-linux-android -o ../godot/addons/godot_wry/bin/android build --locked --release

      - name: Assemble Android Godot template layer
        run: |
          test -f godot/addons/godot_wry/bin/android/arm64-v8a/libgodot_wry.so
          test -f godot/addons/godot_wry/bin/android/x86_64/libgodot_wry.so
          test -f build/android-kotlin/com/example/godotwry/RustWebView.kt
          test -f build/android-kotlin/com/example/godotwry/WryActivity.kt

          # WRY generates a generic AppCompatActivity. Godot needs the customized
          # subclass from PR #91 so its renderer and WebView can coexist.
          cp android/WryActivity.kt build/android-kotlin/com/example/godotwry/WryActivity.kt

          rm -rf godot/addons/godot_wry/android/kotlin
          mkdir -p godot/addons/godot_wry/android/kotlin/com/example/godotwry
          cp build/android-kotlin/com/example/godotwry/*             godot/addons/godot_wry/android/kotlin/com/example/godotwry/

          grep -q "GodotActivity"             godot/addons/godot_wry/android/kotlin/com/example/godotwry/WryActivity.kt

      - name: Stage Android artifact
        run: |
          mkdir -p artifact/bin
          cp -R godot/addons/godot_wry/bin/android artifact/bin/
          cp -R godot/addons/godot_wry/android artifact/

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifact
          if-no-files-found: error

  package:
    name: 📦 Package Godot addons
    needs: [desktop, ios, android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare package root
        run: |
          mkdir -p package/addons
          cp -R godot/addons/godot_wry package/addons/

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: desktop-x86_64-unknown-linux-gnu
          path: package/addons/godot_wry

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: desktop-universal-apple-darwin
          path: package/addons/godot_wry

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: package/addons/godot_wry

      - name: Download iOS binaries
        uses: actions/download-artifact@v4
        with:
          name: ios
          path: package/addons/godot_wry

      - name: Download Android binaries and template layer
        uses: actions/download-artifact@v4
        with:
          name: android
          path: package/addons/godot_wry

      - name: Validate aggregate package
        run: |
          test -f package/addons/godot_wry/WRY.gdextension
          test -f package/addons/godot_wry/bin/x86_64-unknown-linux-gnu/libgodot_wry.so
          test -d package/addons/godot_wry/bin/universal-apple-darwin/libgodot_wry.framework
          test -f package/addons/godot_wry/bin/x86_64-pc-windows-msvc/godot_wry.dll
          test -d package/addons/godot_wry/bin/ios/libgodot_wry.xcframework
          test -f package/addons/godot_wry/bin/android/arm64-v8a/libgodot_wry.so
          test -f package/addons/godot_wry/bin/android/x86_64/libgodot_wry.so
          test -f package/addons/godot_wry/android/kotlin/com/example/godotwry/RustWebView.kt
          test -f package/addons/godot_wry/android/kotlin/com/example/godotwry/WryActivity.kt

          # Smoke-test the Android installer against an existing-project layout.
          touch package/project.godot
          mkdir -p package/android/build
          touch package/android/build/build.gradle
          (
            cd package
            python3 addons/godot_wry/android/install.py
          )
          grep -q 'addons/godot_wry/android/godot_wry.gradle' package/android/build/build.gradle
          rm -rf package/project.godot package/android

      - name: Smoke-test addon with Godot 4.7 stable
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev
          curl -L --fail --retry 3 \
            -o godot47.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  godot47.zip" | sha256sum -c -
          unzip -q godot47.zip

          mkdir -p smoke/addons
          cp -R package/addons/godot_wry smoke/addons/
          cat > smoke/project.godot <<'EOF'
          [application]
          config/name="Godot WRY 4.7 smoke"
          run/main_scene="res://main.tscn"
          EOF
          cat > smoke/main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://smoke.gd" type="Script" id="1"]

          [node name="Smoke" type="Node"]
          script = ExtResource("1")
          EOF
          cat > smoke/smoke.gd <<'EOF'
          extends Node

          func _ready():
              var webview = WebView.new()
              add_child(webview)
              print("GODOT_WRY_47_SMOKE_OK")
              get_tree().quit()
          EOF

          ./Godot_v4.7-stable_linux.x86_64 --headless --editor --path smoke --quit
          ./Godot_v4.7-stable_linux.x86_64 --headless --path smoke 2>&1 | tee godot47-smoke.log
          grep -q "GODOT_WRY_47_SMOKE_OK" godot47-smoke.log

      - name: Create platform packages
        run: |
          cp -R package package-android
          cp -R package package-ios

          find package-android/addons/godot_wry/bin -mindepth 1 -maxdepth 1             ! -name android -exec rm -rf {} +
          find package-ios/addons/godot_wry/bin -mindepth 1 -maxdepth 1             ! -name ios -exec rm -rf {} +
          rm -rf package-ios/addons/godot_wry/android/kotlin

      - name: Upload all-platform Godot addon
        uses: actions/upload-artifact@v4
        with:
          name: godot_wry
          path: package
          if-no-files-found: error

      - name: Upload Android Godot package
        uses: actions/upload-artifact@v4
        with:
          name: godot_wry-android
          path: package-android
          if-no-files-found: error

      - name: Upload iOS Godot package
        uses: actions/upload-artifact@v4
        with:
          name: godot_wry-ios
          path: package-ios
          if-no-files-found: error

  mobile_bundles:
    name: 📱 Self-contained mobile bundles
    needs: [package]
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all-platform addon
        uses: actions/download-artifact@v4
        with:
          name: godot_wry
          path: mobile-base

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.1.0" >/dev/null

      - name: Cache official Godot template archives
        uses: actions/cache@v4
        with:
          path: build/godot-template-cache
          key: godot-4.7-mobile-template-archives-v1

      - name: Download official Godot 4.7 Standard and Mono templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/godot-template-cache

          if [ ! -f build/godot-template-cache/standard.tpz ]; then
            curl -L --fail --retry 3 -o build/godot-template-cache/standard.tpz \
              https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          fi
          echo "9714459dc071907c0f3d5f17d608faf69e7cda21331fc5d39c4503ffa4e99eec  build/godot-template-cache/standard.tpz" | shasum -a 256 -c -

          if [ ! -f build/godot-template-cache/mono.tpz ]; then
            curl -L --fail --retry 3 -o build/godot-template-cache/mono.tpz \
              https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_export_templates.tpz
          fi
          echo "4c02a0b99ad9c5bc243c2e79468628db3df89350d9db8fc995988f69d126e069  build/godot-template-cache/mono.tpz" | shasum -a 256 -c -

      - name: Extract Android and iOS templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mobile-templates

          extract_member() {
            archive="$1"
            suffix="$2"
            output="$3"
            member="$(unzip -Z1 "$archive" | grep -E "(^|/)${suffix}$" | head -1)"
            if [ -z "$member" ]; then
              echo "Could not find $suffix in $archive" >&2
              exit 1
            fi
            unzip -p "$archive" "$member" > "$output"
            unzip -t "$output" >/dev/null
          }

          extract_member build/godot-template-cache/standard.tpz android_source.zip build/mobile-templates/android-standard.zip
          extract_member build/godot-template-cache/mono.tpz android_source.zip build/mobile-templates/android-mono.zip
          extract_member build/godot-template-cache/standard.tpz ios.zip build/mobile-templates/ios-standard.zip
          extract_member build/godot-template-cache/mono.tpz ios.zip build/mobile-templates/ios-mono.zip
          ls -lh build/mobile-templates

      - name: Assemble Android Standard bundle
        run: |
          cp -R mobile-base package-android-standard
          python3 scripts/prepare_android_release.py \
            --package-root package-android-standard \
            --android-source build/mobile-templates/android-standard.zip \
            --template-id 4.7.stable

          cat > package-android-standard/README_ANDROID.md <<'EOF'
          # Godot WRY — Android / Godot 4.7 Standard

          Extract this ZIP into the root of an existing Godot 4.7 Standard project.
          Enable **Gradle Build** in the Android export preset and export normally.

          The official Godot 4.7 Gradle Build Template/AARs, WRY Kotlin bridge,
          WryActivity and arm64-v8a/x86_64 native libraries are already included.
          No additional download and no install.py step are required.
          EOF

      - name: Assemble Android Mono bundle
        run: |
          cp -R mobile-base package-android-mono
          python3 scripts/prepare_android_release.py \
            --package-root package-android-mono \
            --android-source build/mobile-templates/android-mono.zip \
            --template-id 4.7.stable.mono

          cat > package-android-mono/README_ANDROID.md <<'EOF'
          # Godot WRY — Android / Godot 4.7 Mono

          Extract this ZIP into the root of an existing Godot 4.7 Mono project.
          Enable **Gradle Build** in the Android export preset and export normally.

          The official Godot 4.7 Mono Gradle Build Template/AARs, WRY Kotlin bridge,
          WryActivity and arm64-v8a/x86_64 native libraries are already included.
          No additional download and no install.py step are required.
          EOF

      - name: Smoke-test Android Standard Gradle template
        shell: bash
        run: |
          set -euo pipefail
          cd package-android-standard/android/build
          ./gradlew --no-daemon assembleStandardDebug \
            -Pexport_package_name=com.example.godotwrysmoke \
            -Pexport_edition=standard \
            -Pexport_build_type=debug \
            -Pexport_enabled_abis='arm64-v8a|x86_64|'
          grep -R -q "com.example.godotwry.WryActivity" build/intermediates/merged_manifests
          cd ../../..
          rm -rf package-android-standard/android/build/build package-android-standard/android/build/.gradle

      - name: Smoke-test Android Mono Gradle template
        shell: bash
        run: |
          set -euo pipefail
          cd package-android-mono/android/build
          ./gradlew --no-daemon assembleMonoDebug \
            -Pexport_package_name=com.example.godotwrysmokemono \
            -Pexport_edition=mono \
            -Pexport_build_type=debug \
            -Pexport_enabled_abis='arm64-v8a|x86_64|'
          grep -R -q "com.example.godotwry.WryActivity" build/intermediates/merged_manifests
          cd ../../..
          rm -rf package-android-mono/android/build/build package-android-mono/android/build/.gradle

      - name: Assemble iOS bundle
        run: |
          cp -R mobile-base package-ios
          mkdir -p package-ios/godot_wry_ios/templates/4.7.stable
          mkdir -p package-ios/godot_wry_ios/templates/4.7.stable.mono

          cp build/mobile-templates/ios-standard.zip package-ios/godot_wry_ios/templates/4.7.stable/ios.zip
          cp build/mobile-templates/ios-mono.zip package-ios/godot_wry_ios/templates/4.7.stable.mono/ios.zip
          cp scripts/install_ios_templates.py package-ios/godot_wry_ios/install_templates.py
          chmod +x package-ios/godot_wry_ios/install_templates.py

          cat > package-ios/godot_wry_ios/install.command <<'EOF'
          #!/bin/sh
          cd "$(dirname "$0")"
          exec /usr/bin/env python3 install_templates.py "$@"
          EOF
          chmod +x package-ios/godot_wry_ios/install.command

          cat > package-ios/README_IOS.md <<'EOF'
          # Godot WRY — iOS / Godot 4.7

          Includes arm64 device and arm64/x86_64 simulator WRY support, plus the
          official Godot 4.7 Standard and Mono ios.zip export templates.

          After extracting into the project, install the bundled templates once:
              python3 godot_wry_ios/install_templates.py

          The installer is local-only: it copies files already in this Release
          into Godot's export_templates directories and performs no download.
          EOF

      - name: Download Godot 4.7 macOS editor
        run: |
          curl -L --fail --retry 3 -o build/Godot_v4.7-stable_macos.universal.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip
          echo "a6708c336f690e0dd8abd3d587d661707f4f33ed436946a3ec000d2fb497fd6c  build/Godot_v4.7-stable_macos.universal.zip" | shasum -a 256 -c -
          unzip -q build/Godot_v4.7-stable_macos.universal.zip -d build/godot47-macos

      - name: Smoke-test Godot iOS project export
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$(find build/godot47-macos -path '*/Contents/MacOS/Godot' -type f | head -1)"
          test -x "$GODOT"

          mkdir -p ios-smoke/addons ios-smoke/build
          cp -R package-ios/addons/godot_wry ios-smoke/addons/

          cat > ios-smoke/project.godot <<'EOF'
          [application]
          config/name="Godot WRY iOS Smoke"
          run/main_scene="res://main.tscn"
          config/features=PackedStringArray("4.7", "Mobile")

          [rendering]
          renderer/rendering_method="mobile"
          renderer/rendering_method.mobile="mobile"
          EOF

          cat > ios-smoke/main.tscn <<'EOF'
          [gd_scene format=3]

          [node name="Main" type="Node"]
          EOF

          IOS_TEMPLATE="$PWD/package-ios/godot_wry_ios/templates/4.7.stable/ios.zip"
          cat > ios-smoke/export_presets.cfg <<EOF
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/godot-wry-ios-smoke.zip"

          [preset.0.options]

          custom_template/debug="$IOS_TEMPLATE"
          custom_template/release="$IOS_TEMPLATE"
          architectures/arm64=true
          application/app_store_team_id=""
          application/bundle_identifier="com.openai.godotwrysmoke"
          application/export_project_only=true
          EOF

          "$GODOT" --headless --editor --path ios-smoke --quit
          "$GODOT" --headless --path ios-smoke \
            --export-debug iOS build/godot-wry-ios-smoke.zip

          test -f ios-smoke/build/godot-wry-ios-smoke.zip
          mkdir -p ios-smoke/build/xcode
          unzip -q ios-smoke/build/godot-wry-ios-smoke.zip -d ios-smoke/build/xcode
          test "$(find ios-smoke/build/xcode -name 'libgodot_wry.xcframework' | wc -l | tr -d ' ')" -ge 1

      - name: Link exported iOS project for simulator
        shell: bash
        run: |
          set -euo pipefail
          XCODEPROJ="$(find ios-smoke/build/xcode -name '*.xcodeproj' -type d | head -1)"
          test -n "$XCODEPROJ"
          SCHEME="$(xcodebuild -project "$XCODEPROJ" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload Android Standard bundle
        uses: actions/upload-artifact@v4
        with:
          name: godot_wry-android-godot4.7
          path: package-android-standard
          if-no-files-found: error

      - name: Upload Android Mono bundle
        uses: actions/upload-artifact@v4
        with:
          name: godot_wry-android-godot4.7-mono
          path: package-android-mono
          if-no-files-found: error

      - name: Upload iOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: godot_wry-ios-godot4.7
          path: package-ios
          if-no-files-found: error


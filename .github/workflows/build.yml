name: 🤖 GDExtension

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# CI builds distributable Godot addon artifacts for desktop, Android and iOS.
jobs:
  desktop:
    name: 🏗️ Desktop / ${{ matrix.platform.os-name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: 🐧 Linux (64-bit)
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os-name: 🍎 macOS (Universal)
            runs-on: macos-latest
            target: universal-apple-darwin
          - os-name: 🪟 Windows (64-bit)
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.runs-on }}
    env:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: ${{ matrix.platform.runs-on == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y             libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev             build-essential curl wget file libssl-dev             libayatana-appindicator3-dev librsvg2-dev             libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform.target }}

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Build binaries
        shell: bash
        run: just ${{ matrix.platform.target == 'universal-apple-darwin' && 'build-macos-universal' || 'build' }}

      - name: Code sign and notarize macOS library
        if: ${{ matrix.platform.target == 'universal-apple-darwin' && github.ref == 'refs/heads/main' && env.APPLE_CERT_BASE64 != '' }}
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_DEV_ID: ${{ secrets.APPLE_DEV_ID }}
          APPLE_DEV_TEAM_ID: ${{ secrets.APPLE_DEV_TEAM_ID }}
          APPLE_DEV_PASSWORD: ${{ secrets.APPLE_DEV_PASSWORD }}
          APPLE_DEV_APP_ID: ${{ secrets.APPLE_DEV_APP_ID }}
        run: |
          brew install powershell
          pwsh ./scripts/ci_sign_macos.ps1 godot/addons/godot_wry/bin/universal-apple-darwin/libgodot_wry.framework

      - name: Stage desktop artifact
        shell: bash
        run: |
          mkdir -p artifact/bin
          cp -R "godot/addons/godot_wry/bin/${{ matrix.platform.target }}" artifact/bin/

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform.target }}
          path: artifact
          if-no-files-found: error

  ios:
    name: 📱 iOS / device + simulator turnkey
    needs: [desktop]
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Build static iOS XCFramework
        run: just build-ios

      - name: Validate iOS XCFramework
        run: |
          XC=godot/addons/godot_wry/bin/ios/libgodot_wry.xcframework
          test -f "$XC/Info.plist"
          test "$(find "$XC" -name 'libgodot_wry.a' | wc -l | tr -d ' ')" -eq 2
          plutil -p "$XC/Info.plist"
          nm -gU "$(find "$XC" -path '*ios-arm64/*' -name 'libgodot_wry.a' | head -1)" | grep gdext_rust_init
          nm -gU "$(find "$XC" -path '*ios-arm64_x86_64-simulator/*' -name 'libgodot_wry.a' | head -1)" | grep gdext_rust_init

      - name: Build iOS turnkey package
        run: |
          mkdir -p turnkey-ios/addons
          cp -R godot/addons/godot_wry turnkey-ios/addons/
          find turnkey-ios/addons/godot_wry/bin -mindepth 1 -maxdepth 1 \
            ! -name ios -exec rm -rf {} +
          rm -rf turnkey-ios/addons/godot_wry/android/kotlin

      - name: Add Linux host binaries to iOS package
        uses: actions/download-artifact@v4
        with:
          name: desktop-x86_64-unknown-linux-gnu
          path: turnkey-ios/addons/godot_wry

      - name: Add macOS host binaries to iOS package
        uses: actions/download-artifact@v4
        with:
          name: desktop-universal-apple-darwin
          path: turnkey-ios/addons/godot_wry

      - name: Add Windows host binaries to iOS package
        uses: actions/download-artifact@v4
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: turnkey-ios/addons/godot_wry

      - name: Install Godot 4.7 iOS export template
        run: |
          python3 scripts/fetch_remote_zip_member.py \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz \
            templates/ios.zip \
            ios.zip
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp ios.zip "$TEMPLATE_DIR/ios.zip"

      - name: Download Godot 4.7 editor
        run: |
          curl -L --fail --retry 3 \
            -o godot47-macos.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_macos.universal.zip
          unzip -q godot47-macos.zip -d godot47-editor
          GODOT_BIN="$(find godot47-editor -path '*.app/Contents/MacOS/Godot' | head -1)"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Smoke-test Godot 4.7 iOS project export
        run: |
          cat > turnkey-ios/project.godot <<'EOF'
          [application]
          config/name="Godot WRY iOS Smoke"
          run/main_scene="res://main.tscn"
          config/features=PackedStringArray("4.7", "Mobile")
          EOF

          cat > turnkey-ios/main.tscn <<'EOF'
          [gd_scene format=3]

          [node name="Main" type="Node"]
          EOF

          cat > turnkey-ios/export_presets.cfg <<'EOF'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/GodotWryIOSSmoke.xcodeproj"
          patches=PackedStringArray()
          patch_delta_encoding=false
          patch_delta_compression_level_zstd=19
          patch_delta_min_reduction=0.1
          patch_delta_include_filters="*"
          patch_delta_exclude_filters=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          architectures/arm64=true
          application/app_store_team_id="ABCDEFGHIJ"
          application/export_method_debug=1
          application/code_sign_identity_debug=""
          application/code_sign_identity_release=""
          application/provisioning_profile_specifier_debug=""
          application/provisioning_profile_specifier_release=""
          application/export_method_release=0
          application/targeted_device_family=2
          application/bundle_identifier="com.minghuiliu.godotwry.iossmoke"
          application/signature=""
          application/short_version="0.3.0"
          application/version="1"
          application/min_ios_version="13.0"
          application/additional_plist_content=""
          application/icon_interpolation=4
          application/export_project_only=true
          application/delete_old_export_files_unconditionally=true
          application/generate_simulator_library_if_missing=false
          entitlements/increased_memory_limit=false
          entitlements/game_center=false
          entitlements/push_notifications="Disabled"
          entitlements/additional=""
          capabilities/access_wifi=false
          capabilities/performance_gaming_tier=false
          capabilities/performance_a12=false
          capabilities/additional=PackedStringArray()
          user_data/accessible_from_files_app=false
          user_data/accessible_from_itunes_sharing=false
          privacy/camera_usage_description=""
          privacy/camera_usage_description_localized={}
          privacy/microphone_usage_description=""
          privacy/microphone_usage_description_localized={}
          privacy/photolibrary_usage_description=""
          privacy/photolibrary_usage_description_localized={}
          privacy/file_timestamp_access_reasons=3
          privacy/system_boot_time_access_reasons=1
          privacy/disk_space_access_reasons=3
          privacy/active_keyboard_access_reasons=0
          privacy/user_defaults_access_reasons=0
          privacy/tracking_enabled=false
          privacy/tracking_domains=PackedStringArray()
          EOF

          mkdir -p turnkey-ios/build
          "$GODOT_BIN" --headless --editor --path turnkey-ios --quit
          "$GODOT_BIN" --headless --path turnkey-ios \
            --export-debug iOS turnkey-ios/build/GodotWryIOSSmoke.xcodeproj

          PBX=turnkey-ios/build/GodotWryIOSSmoke.xcodeproj/project.pbxproj
          test -f "$PBX"
          grep -q "libgodot_wry.xcframework" "$PBX"
          grep -q "gdext_rust_init" "$PBX"

          xcodebuild \
            -project turnkey-ios/build/GodotWryIOSSmoke.xcodeproj \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Stage iOS intermediate artifact
        run: |
          mkdir -p artifact/bin
          cp -R godot/addons/godot_wry/bin/ios artifact/bin/

      - name: Upload iOS intermediate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifact
          if-no-files-found: error

      - name: Upload iOS turnkey package
        uses: actions/upload-artifact@v4
        with:
          name: godot_wry-ios-godot4.7
          path: turnkey-ios
          if-no-files-found: error

  android:
    name: 🤖 Android / arm64-v8a + x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Select Android NDK
        shell: bash
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          elif [ -n "${ANDROID_NDK_ROOT:-}" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          else
            echo "No Android NDK found on runner" >&2
            exit 1
          fi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare WRY Kotlin output
        run: mkdir -p "$GITHUB_WORKSPACE/build/android-kotlin/com/example/godotwry"

      - name: Build Android native libraries
        working-directory: rust
        env:
          WRY_ANDROID_PACKAGE: com.example.godotwry
          WRY_ANDROID_LIBRARY: godot_wry
          WRY_ANDROID_KOTLIN_FILES_OUT_DIR: ${{ github.workspace }}/build/android-kotlin/com/example/godotwry
        run: |
          cargo ndk -t aarch64-linux-android -o ../godot/addons/godot_wry/bin/android build --locked --release
          cargo ndk -t x86_64-linux-android -o ../godot/addons/godot_wry/bin/android build --locked --release

      - name: Assemble Android Godot template layer
        run: |
          test -f godot/addons/godot_wry/bin/android/arm64-v8a/libgodot_wry.so
          test -f godot/addons/godot_wry/bin/android/x86_64/libgodot_wry.so
          test -f build/android-kotlin/com/example/godotwry/RustWebView.kt
          test -f build/android-kotlin/com/example/godotwry/WryActivity.kt

          # WRY generates a generic AppCompatActivity. Godot needs the customized
          # subclass from PR #91 so its renderer and WebView can coexist.
          cp android/WryActivity.kt build/android-kotlin/com/example/godotwry/WryActivity.kt

          rm -rf godot/addons/godot_wry/android/kotlin
          mkdir -p godot/addons/godot_wry/android/kotlin/com/example/godotwry
          cp build/android-kotlin/com/example/godotwry/*             godot/addons/godot_wry/android/kotlin/com/example/godotwry/

          grep -q "GodotActivity"             godot/addons/godot_wry/android/kotlin/com/example/godotwry/WryActivity.kt

      - name: Stage Android artifact
        run: |
          mkdir -p artifact/bin
          cp -R godot/addons/godot_wry/bin/android artifact/bin/
          cp -R godot/addons/godot_wry/android artifact/

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifact
          if-no-files-found: error

  package:
    name: 📦 Package Godot addons
    needs: [desktop, ios, android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare package root
        run: |
          mkdir -p package/addons
          cp -R godot/addons/godot_wry package/addons/

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: desktop-x86_64-unknown-linux-gnu
          path: package/addons/godot_wry

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: desktop-universal-apple-darwin
          path: package/addons/godot_wry

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: package/addons/godot_wry

      - name: Download iOS binaries
        uses: actions/download-artifact@v4
        with:
          name: ios-aarch64-apple-ios
          path: package/addons/godot_wry

      - name: Download Android binaries and template layer
        uses: actions/download-artifact@v4
        with:
          name: android
          path: package/addons/godot_wry

      - name: Validate aggregate package
        run: |
          test -f package/addons/godot_wry/WRY.gdextension
          test -f package/addons/godot_wry/bin/x86_64-unknown-linux-gnu/libgodot_wry.so
          test -d package/addons/godot_wry/bin/universal-apple-darwin/libgodot_wry.framework
          test -f package/addons/godot_wry/bin/x86_64-pc-windows-msvc/godot_wry.dll
          test -d package/addons/godot_wry/bin/aarch64-apple-ios/libgodot_wry.xcframework
          test -f package/addons/godot_wry/bin/android/arm64-v8a/libgodot_wry.so
          test -f package/addons/godot_wry/bin/android/x86_64/libgodot_wry.so
          test -f package/addons/godot_wry/android/kotlin/com/example/godotwry/RustWebView.kt
          test -f package/addons/godot_wry/android/kotlin/com/example/godotwry/WryActivity.kt

          # Smoke-test the Android installer against an existing-project layout.
          touch package/project.godot
          mkdir -p package/android/build
          touch package/android/build/build.gradle
          (
            cd package
            python3 addons/godot_wry/android/install.py
          )
          grep -q 'addons/godot_wry/android/godot_wry.gradle' package/android/build/build.gradle
          rm -rf package/project.godot package/android

      - name: Smoke-test addon with Godot 4.7 stable
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev
          curl -L --fail --retry 3 \
            -o godot47.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          echo "0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  godot47.zip" | sha256sum -c -
          unzip -q godot47.zip

          mkdir -p smoke/addons
          cp -R package/addons/godot_wry smoke/addons/
          cat > smoke/project.godot <<'EOF'
          [application]
          config/name="Godot WRY 4.7 smoke"
          run/main_scene="res://main.tscn"
          EOF
          cat > smoke/main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource path="res://smoke.gd" type="Script" id="1"]

          [node name="Smoke" type="Node"]
          script = ExtResource("1")
          EOF
          cat > smoke/smoke.gd <<'EOF'
          extends Node

          func _ready():
              var webview = WebView.new()
              add_child(webview)
              print("GODOT_WRY_47_SMOKE_OK")
              get_tree().quit()
          EOF

          ./Godot_v4.7-stable_linux.x86_64 --headless --editor --path smoke --quit
          ./Godot_v4.7-stable_linux.x86_64 --headless --path smoke 2>&1 | tee godot47-smoke.log
          grep -q "GODOT_WRY_47_SMOKE_OK" godot47-smoke.log

      - name: Create platform packages
        run: |
          cp -R package package-android
          cp -R package package-ios

          find package-android/addons/godot_wry/bin -mindepth 1 -maxdepth 1             ! -name android -exec rm -rf {} +
          find package-ios/addons/godot_wry/bin -mindepth 1 -maxdepth 1             ! -name aarch64-apple-ios -exec rm -rf {} +
          rm -rf package-ios/addons/godot_wry/android/kotlin

      - name: Upload all-platform Godot addon
        uses: actions/upload-artifact@v4
        with:
          name: godot_wry
          path: package
          if-no-files-found: error

      - name: Upload Android Godot package
        uses: actions/upload-artifact@v4
        with:
          name: godot_wry-android
          path: package-android
          if-no-files-found: error

      - name: Upload iOS Godot package
        uses: actions/upload-artifact@v4
        with:
          name: godot_wry-ios
          path: package-ios
          if-no-files-found: error

  release:
    name: 🚀 Publish GitHub Release
    needs: [package]
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v0.2.0

    steps:
      - name: Download all-platform package
        uses: actions/download-artifact@v4
        with:
          name: godot_wry
          path: release/godot_wry

      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: godot_wry-android
          path: release/godot_wry-android

      - name: Download iOS package
        uses: actions/download-artifact@v4
        with:
          name: godot_wry-ios
          path: release/godot_wry-ios

      - name: Create release ZIP files
        run: |
          (cd release/godot_wry && zip -qr ../godot_wry.zip .)
          (cd release/godot_wry-android && zip -qr ../godot_wry-android.zip .)
          (cd release/godot_wry-ios && zip -qr ../godot_wry-ios.zip .)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Godot WRY 0.2.0

          This release upgrades the extension to **Godot 4.7** and adds support for running WebViews while the game is embedded in the Godot Editor's Game workspace.

          ### Highlights
          - Godot 4.7 / godot-rust 0.5.5 (`api-4-7`)
          - Windows/Linux embedded-game mode continues to use Godot's native child game window
          - macOS 4.7 embedded-game mode uses an automatic editor-process WebView bridge compatible with Godot's CAContext/CALayer renderer
          - WebView bounds, visibility, navigation, JavaScript evaluation, IPC, page-load events, focus, zoom and devtools are mirrored in embedded mode
          - Existing Android and iOS support is retained

          ### Included packages
          - `godot_wry.zip`: all supported platforms
          - `godot_wry-android.zip`: Android arm64-v8a + x86_64, including WRY Kotlin/Godot Gradle integration
          - `godot_wry-ios.zip`: iOS arm64 device XCFramework

          ### Android
          After extracting into an existing Godot project, install the Godot Android Build Template once, then run:
          ```bash
          python addons/godot_wry/android/install.py
          ```
          Export Android with Gradle Build enabled.

          ### iOS
          Includes a device-arm64 XCFramework under `addons/godot_wry/bin/aarch64-apple-ios/`.

          ### Editor embedded game mode
          No editor plugin needs to be enabled. On macOS, the extension automatically hosts WKWebView in the editor process when `Engine.is_embedded_in_editor()` is active.

          Built and validated by GitHub Actions on Linux, Windows, macOS, Android and iOS, including a real Godot 4.7 addon load smoke test.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG"               release/godot_wry.zip               release/godot_wry-android.zip               release/godot_wry-ios.zip               --clobber               --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG"               release/godot_wry.zip               release/godot_wry-android.zip               release/godot_wry-ios.zip               --target "$GITHUB_SHA"               --title "Godot WRY v0.2.0 — Godot 4.7 & Editor Embedded WebView"               --notes-file release-notes.md               --repo "$GITHUB_REPOSITORY"
          fi

